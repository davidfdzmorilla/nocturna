[project]
name = "nocturna"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "psycopg[binary]>=3.2",
    "httpx>=0.27",
    # anyio es dependencia de RUNTIME, no solo de test: infrastructure/arxiv/rate_limit.py
    # usa anyio.sleep como valor por defecto del espaciado entre peticiones.
    "anyio>=4",
]

[project.scripts]
nocturna = "nocturna.cli:main"

[dependency-groups]
# `pipeline` lleva el SDK del agente: solo lo necesita el Mac que ejecuta el
# pipeline (T107, ADR 0044); las imágenes de producción no lo instalan.
# `serve` es el servidor ASGI de las imágenes de producción; `dev` conserva
# uvicorn para `uvicorn --reload` en local.
pipeline = ["claude-agent-sdk>=0.1"]
serve = ["uvicorn>=0.30"]
dev = ["pytest>=8", "ruff>=0.6", "uvicorn>=0.30"]

[tool.uv]
default-groups = ["dev", "pipeline"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nocturna"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not manual'"
markers = [
    "manual: llama a Claude de verdad; solo lo lanza el autor a mano",
    "db: corre contra el PostgreSQL de docker compose (base nocturna_test)",
    "docker: construye imagenes de produccion con Docker (T107); requiere NOCTURNA_CHECK_IMAGES=1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

# `Depends(...)`/`Query(...)` viven en los metadatos de `Annotated[...]` en
# todo `api/` (T50, corrección de revisión), no como valor por defecto de un
# argumento: B008 (flake8-bugbear) no los trata como llamada mutable
# arriesgada en ese estilo, así que `extend-immutable-calls` ya no hace
# falta. Si un futuro endpoint volviera al estilo `= Depends(...)`, ruff
# debe volver a marcarlo -- no se restaura esta excepción sin repensarlo.

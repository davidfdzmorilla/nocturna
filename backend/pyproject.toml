[project]
name = "nocturna"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "psycopg[binary]>=3.2",
    "claude-agent-sdk>=0.1",
    "httpx>=0.27",
    # anyio es dependencia de RUNTIME, no solo de test: infrastructure/arxiv/rate_limit.py
    # usa anyio.sleep como valor por defecto del espaciado entre peticiones.
    "anyio>=4",
]

[project.scripts]
nocturna = "nocturna.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nocturna"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not manual'"
markers = [
    "manual: llama a Claude de verdad; solo lo lanza el autor a mano",
    "db: corre contra el PostgreSQL de docker compose (base nocturna_test)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

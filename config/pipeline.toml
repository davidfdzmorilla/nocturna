# Configuración del pipeline nocturno de Nocturna.
# Ninguna clave de esta sección tiene valor por defecto en código: si falta o
# está mal escrita, la carga debe fallar (ver infrastructure/config.py).

[budget]
# nightly_tokens: tope fijado en CLAUDE.md ("Control de gasto"), valor inicial conservador.
nightly_tokens = 300000
# editor_reserve_tokens: propuesto, se calibra en T60 con Settings > Usage.
editor_reserve_tokens = 60000
# writer_reserve_tokens (T75): reserva anidada del redactor de tensiones
# (ADR 0025). Reparto: Reader+Popularizer ven B-E-W = 300.000 - 60.000 -
# 24.000 = 216.000; el redactor ve B-E = 240.000; el Editor ve B. 24.000 =
# max_writer_calls_per_night x writer_estimated_tokens = 2 x 12.000 (el
# validador de PipelineConfig lo exige). Fija, no escala con
# reset_day_multiplier.
writer_reserve_tokens = 24000
# writer_estimated_tokens: estimación por llamada del redactor. Su salida
# (titular y tres niveles) es como la del Popularizer (5.290 de media, 11.492
# de máximo); la entrada añade previas, sigma y evidencia, sin abstract. Real
# esperado ~6.300; 12.000 ~ 1,9x esa media y cubre el máximo del Popularizer.
writer_estimated_tokens = 12000
# weekly_reset_weekday / weekly_reset_hour: PLACEHOLDER, decisión abierta (docs/OPEN_DECISIONS.md).
weekly_reset_weekday = "monday"
weekly_reset_hour = 0
reset_day_multiplier = 1.0
# reader_estimated_tokens: estimación de coste que se compara contra el
# presupuesto restante antes de llamar al Reader (`BudgetGuard.authorize`),
# no el gasto real, que no se conoce hasta después de la llamada. Composición
# aproximada (T41): prompt de rol (~290 tokens medidos) + abstract medio
# (~350) + el gasto lateral de Haiku que T40 midió por llamada (~950) +
# salida (~600) ≈ 2.200, doblado por margen ≈ 6.000. Si el gasto real de una
# llamada supera esta estimación, nightly_tokens se rebasa en (real −
# estimado) de esa última llamada: modo de fallo que ya tenía el diseño de
# T30, no uno nuevo de T41. Valor a calibrar en T60, como item_timeout_s.
reader_estimated_tokens = 6000
# reader_v3_estimated_tokens: misma lógica que reader_estimated_tokens, para
# la variante `reader-v3` del Reader (medidas estructuradas por planeta,
# T71.c), usada solo en los ítems de `[reader] measurement_categories`.
# Composición: T71.b midió 6.400 tokens/llamada (por abstract, no por
# medida individual: un abstract con varias medidas es una sola llamada) en
# promedio y un máximo de 7.574 sobre los 4 abstracts de
# `tests/fixtures/t71b/abstracts.json` (prompt experimental
# `reader-measures-exp1`, precursor de `reader-v3`, con el mismo tamaño de
# salida). 13.000 ≈ 2x la media medida (6.400) y ≈ 1,7x el máximo observado
# (7.574), mismo criterio de margen que T41/T42 aplicaron a sus propias
# estimaciones. Valor a calibrar en T60/T71.c con datos de una noche real.
reader_v3_estimated_tokens = 13000
# popularizer_estimated_tokens: misma lógica que reader_estimated_tokens,
# para el Popularizer. Composición aproximada (T42): prompt de rol (~600-700
# tokens, define tres niveles, más largo que los ~290 del Reader) + la
# Reading serializada (título, resumen ~100, objetos ~30, hasta 5 claims
# ~150) ≈ 1.000 de entrada; el gasto lateral de Haiku que T40 midió por
# llamada (~950); salida de hasta 660 palabras entre los tres niveles y el
# titular, en español a ~1,6 tokens/palabra ≈ 1.300-1.400 -- el componente
# que domina y donde el Popularizer se separa del Reader (442 de salida en el
# humo real). Real esperado ≈ 3.350, con el mismo margen que T41 aplicó
# (6.000 sobre 2.796 medidos ≈ 2,15x) → 7.000. Si el gasto real de una
# llamada supera esta estimación, nightly_tokens se rebasa en (real -
# estimado) de esa última llamada, igual que con el Reader. Valor a calibrar
# en T60, con popularizer-v1 como baseline.
#
# Aritmética del pool Reader+Popularizer = nightly_tokens -
# editor_reserve_tokens - writer_reserve_tokens = 300.000 - 60.000 - 24.000
# = 216.000 (T75; antes eran 240.000). T71.c introdujo
# reader-v3 (más caro) solo para los ítems de astro-ph.EP
# ([reader] measurement_categories); el resto de categorías sigue con
# reader-v2. Con los 30 ítems de max_items_per_night repartidos entre EP y
# no-EP, y usando lo MEDIDO (no la estimación conservadora de arriba): 6.400
# tokens/llamada en EP (reader-v3, T71.b) y 3.056 tokens/ítem en no-EP
# (reader-v2, ver CLAUDE.md). Caso esperado (mezcla ilustrativa, 11 EP de
# 30): 11 x 6.400 + 19 x 3.056 ≈ 128.500 de Reader, dejando ≈ 87.500 para
# el Popularizer -- a ~4.560 tokens/candidato medidos (CLAUDE.md), ≈ 19
# candidatos, sin reintento. Peor caso, los 30 ítems siendo EP: 30 x 6.400 =
# 192.000 de Reader, dejando solo 24.000 para el Popularizer:
# BudgetGuard.authorize exige que el presupuesto restante cubra la
# ESTIMACIÓN (popularizer_estimated_tokens = 7.000), no el gasto medido de
# 4.560/9.120, así que admite menos candidatos de los que daría
# 24.000 / 4.560 sin más: ≈ 4 sin reintento (con ~4.560 medidos gastados
# por cada uno de los 4 anteriores, a la 5ª llamada ya no quedan 7.000
# libres) y ≈ 2 con reintento a 9.120 (mismo motivo, con el coste doblado
# de cada candidato ya gastado). La noche cierra `partial`, con las reservas
# del redactor (24.000) y del Editor (60.000) intactas -- el fallo es "se publica menos", no "se
# rebasa el presupuesto".
# Qué fracción de la ingesta real es EP sigue siendo la incógnita de T60;
# este cálculo es orientativo, a recalibrar con datos de campo. Si algún
# día se sube max_items_per_night, hay que repetirlo (ver también el
# comentario de [limits] sobre por qué T71.c lo bajó de 40 a 30).
popularizer_estimated_tokens = 7000
# editor_base_tokens: parte fija de la estimación de coste del Editor, la
# única llamada de la noche a Opus, sobre la que `PipelineConfig` exige que
# `editor_base_tokens + (max_items_per_night + max_candidates_per_night +
# max_writer_calls_per_night) * editor_tokens_per_candidate` quepa en
# `editor_reserve_tokens` (ver el validador de `PipelineConfig`).
# T60: con dos observaciones reales del coste del Editor -- T43 humo,
# N=3 -> 3.381 tokens; primera noche real (2026-09-18), N=14 -> 11.890
# tokens -- se ajusta la recta que pasa por ambos puntos: ~774
# tokens/candidato sobre ~1.060 fijos.
#
# Las dos rectas de estimación (la vieja, 4.000 + 700xN, y esta) se cruzan
# exactamente en N=10 (ambas dan 11.000); por debajo de N=10 la nueva es
# MENOS conservadora que la vieja: el margen baja de 1,80x a 1,49x en N=3,
# y de 2,56x a 1,83x en N=1. Lo que motiva el cambio no es una monotonía
# inexistente sino el peor caso que la guarda existe para cubrir: en N=40,
# que era `max_items_per_night` cuando se hizo este ajuste (T71.c lo bajó a
# 30, ver [limits]), la vieja estimación (32.000) ya caía por DEBAJO de la
# recta observada (≈32.002) -- ya era un subestimador justo donde más
# importa. La nueva queda por ENCIMA de la recta observada en todo el rango
# 1-40 (nuevo - recta = 1.440 + 76xN, estrictamente positivo y creciente):
# margen mínimo 1,14x en N=40; N=3 -> 1,49x; N=14 -> 1,21x. Con
# `max_items_per_night = 30` el peor caso real hoy es N=30, dentro de ese
# mismo rango y con margen aún mayor: 1,15x.
#
# Es un ajuste PROVISIONAL: dos observaciones para dos parámetros es un
# sistema exactamente determinado (residuo cero, cero confianza), no una
# regresión con la que fiarse. Se reajusta por regresión sobre ~14 noches
# al cierre de T60. Ver docs/CALIBRACION.md ("Hallazgo 2").
#
# El invariante que valida `PipelineConfig` (arriba) cubre UN intento del
# Editor; `max_editor_calls_per_night = 2` autoriza un segundo intento
# contra el presupuesto completo si el primero falla por JSON inválido. Con
# `max_items_per_night = 40` (el valor de cuando se hizo este ajuste), dos
# intentos a N=40 suman 73.000 tokens (2 x 36.500) frente a los 60.000 de
# `editor_reserve_tokens`. Es propiedad preexistente -- el segundo intento
# se autoriza contra el presupuesto completo y se deniega si no cabe,
# cerrando la noche `partial` --, pero este ajuste sube ese peor caso de
# 64.000 (con los valores viejos: 2 x 32.000) a 73.000, y merece constar.
# Con `max_items_per_night = 30` (T71.c) el peor caso real hoy es menor:
# dos intentos a N=30 suman 56.000 tokens (2 x 28.000), holgado frente a
# los 60.000 de `editor_reserve_tokens`.
editor_base_tokens = 2500
# editor_tokens_per_candidate: coste marginal, por candidato, de la única
# llamada al Editor. Multiplicado por `max_items_per_night` en el
# validador de `PipelineConfig` para comprobar que la reserva del Editor
# basta en el peor caso (todos los ítems de la noche llegando como
# candidatos). Ajustado junto con editor_base_tokens (ver comentario ahí)
# a partir de las mismas dos observaciones reales (N=3 -> 3.381; N=14 ->
# 11.890): recta ~774 tokens/candidato sobre ~1.060 fijos, redondeada a
# 850 sobre 2.500 fijos para quedar por encima de lo observado en todo el
# rango, no solo en los dos puntos medidos. Mismo carácter PROVISIONAL que
# editor_base_tokens: a reajustar por regresión sobre ~14 noches al cierre
# de T60.
editor_tokens_per_candidate = 850

[limits]
# max_items_per_night: valor inicial de CLAUDE.md ("Control de gasto") era
# 40; T71.c lo bajó a 30 -- sin el recorte, el pool Reader+Popularizer se
# agota antes de que la variante `reader-v3` (más cara, ver
# budget.reader_v3_estimated_tokens) pueda leer los ítems de
# [reader] measurement_categories. max_turns_per_agent: fijado en CLAUDE.md.
max_items_per_night = 30
max_turns_per_agent = 3
# item_timeout_s y run_timeout_s: propuestos, se calibran en T60.
item_timeout_s = 180
run_timeout_s = 16200
# editor_timeout_s: timeout propio del Editor, separado de item_timeout_s.
# item_timeout_s (180 s) está pensado para una llamada del Reader/Popularizer
# sobre un único abstract; el Editor recibe, en una sola llamada a Opus,
# hasta max_items_per_night (30) candidatos de la noche entera -- no cabe en
# esa ventana. Un LLMTimeout no se reintenta en AgentRunner.run (es uno de
# los tres desenlaces terminales, junto a LLMRateLimited y LLMError), así que
# un timeout corto para el Editor no es "otro intento": es la noche entera
# sin publicar nada, con la reserva del Editor ya gastada. 300 s es un valor
# propuesto, igual que item_timeout_s; se calibra en T60 con la latencia real
# de Opus sobre 30 candidatos.
editor_timeout_s = 300
# max_editor_calls_per_night: acota intentos, no éxitos. Lo que cuesta
# presupuesto es el intento, no el acierto, así que se cuentan las llamadas
# de cualquier estado; el 2 preserva "un Editor por noche" en su sentido real
# (una edición publicada) y deja vivo el reintento por JSON inválido que
# concede CLAUDE.md. Valor a calibrar en T60.
max_editor_calls_per_night = 2
# max_writer_calls_per_night (T75): tope de intentos del redactor por noche,
# de cualquier estado, independiente de los tokens; 0 apaga el redactor. 2 =
# una tensión con su reintento por JSON inválido, o dos sin reintento (los
# datos dan 0-1 tensiones por noche). Con writer_estimated_tokens = 12.000
# cabe exacto en writer_reserve_tokens (24.000). Además entra como cota
# superior de candidatos en el validador de la reserva del Editor:
# 2.500 + (30 + 5 + 2) x 850 = 33.950 <= 60.000.
max_writer_calls_per_night = 2
# max_calls_per_item: tope de llamadas de Reader/Popularizer por ítem (el
# intento más el reintento por JSON inválido que concede CLAUDE.md). El tope
# de llamadas de Reader/Popularizer en toda la noche sale de multiplicar
# esta clave por max_items_per_night, nunca de un "2" escrito a mano en
# application/budget.py. Valor a calibrar en T60.
max_calls_per_item = 2
# popularizer_min_interest_score: umbral de Reading.interest_score a partir
# del cual se llama al Popularizer. PLAN_TAREAS.md fija en T60 «se decide si
# el interest_score >= 4 es el umbral correcto»: tiene que ser calibrable sin
# tocar código, de ahí que sea configuración y no un literal en el
# orquestador.
popularizer_min_interest_score = 4
# max_consecutive_failures: cortacircuitos de fallos consecutivos, cualquier
# rol. Mitigación (a) que docs/TECHNICAL_DEBT.md asigna a T44 para la fuga
# de ~600.000-800.000 tokens/noche de llamadas que mueren antes de un
# ResultMessage (timeout de socket, cancelación previa a cualquier
# respuesta, kill del proceso): esas llamadas no dejan usage ni
# model_usage que contabilizar, así que la única defensa posible es dejar
# de intentarlo. Con 5 fallos seguidos, RunNight cierra el Run como
# partial en vez de seguir gastando sesiones sin contabilidad sobre el
# resto de la noche -- acota la fuga a ~5 llamadas fallidas en vez de
# hasta las 80 que permite CALL_LIMIT_REACHED. Valor propuesto sin datos
# de campo, a calibrar en T60.
max_consecutive_failures = 5

[window]
start = "00:00"
hard_stop = "04:45"
# timezone: la hora local del sistema depende de `TZ`, que `cron` no siempre
# propaga y que un contenedor pone en UTC por defecto. Con el proceso en UTC,
# un hard_stop de 04:45 se dispararía a las 06:45 locales y abriría la
# segunda sesión de cinco horas que CLAUDE.md prohíbe. La clave hace el
# comportamiento reproducible y testeable, incluidos los cambios de hora.
timezone = "Europe/Madrid"

[models]
reader = "sonnet"
popularizer = "sonnet"
editor = "opus"
writer = "sonnet"

[reader]
# measurement_categories: categorías arXiv sobre las que el Reader usa la
# variante `reader-v3` (medidas estructuradas por planeta, T71.c) en vez de
# `reader-v2`. Cada categoría debe existir también en
# sources.arxiv.categories (validado en PipelineConfig). Lista vacía
# admitida = v3 apagado (decisión del autor, 2026-09-29). Solo
# "astro-ph.EP" por ahora: es la única categoría de las ingeridas hoy donde
# un abstract razonablemente menciona masa/radio/periodo de un planeta
# concreto con error.
measurement_categories = ["astro-ph.EP"]

[exoplanet_filter]
# T79: marca de la ingesta que decide la variante del Reader. Un ítem usa
# `reader-v3` solo si casa con este filtro Y está en una categoría de
# [reader] measurement_categories; el resto, `reader-v2`.
# `planet`/`planets` NO se incluyen como palabra clave.
#
# keywords: palabra completa, sin distinguir mayúsculas.
keywords = ["exoplanet", "exoplanets"]
# designation_patterns: regex Python que SÍ distinguen mayúsculas, buscadas
# sobre título+abstract normalizados (`~`, `\,` y comas entre alfanuméricos
# pasan a espacio; guiones unicode a "-"). La letra de planeta es minúscula
# [b-i], así que "HD 189733 A" (componente estelar) no casa. Separadores
# flexibles: espacio, guion o nada ("TOI-6981 b", "TOI 6981b", "WASP-12b").
# Letras de planeta: una o varias en orden estrictamente ascendente y sin
# separar ("b", "bc", "bcd", "ce"), para "HIP 67522 bc" (corrección del autor,
# 2026-10-01). Se escribe como alternativas por primera letra
# (`bc?d?…|cd?…|…|h`): al menos una letra; "bed" o "cb" no casan.
designation_patterns = [
  # [0] Catálogos con número, letra de planeta opcional y \b final: TOI, KOI, K2,
  # Kepler, WASP, HAT-P, HATS, KELT, NGTS, CoRoT, XO, TrES, Qatar. "Kepler 2nd
  # law" no casa; HR, TWA y PDS van en [2] (letra obligatoria). Un número
  # seguido de unidad de tiempo no es designación ("Kepler 4-year baseline",
  # "NGTS 2 years"); "d" no se excluye porque es letra de planeta ("Kepler-90 d").
  '\b(?:TOI|KOI|K2|Kepler|WASP|HAT-?P|HATS|KELT|NGTS|CoRoT|XO|TrES|Qatar)[ -]?\d+(?:\.\d+)?(?![ -]?(?:years?|yrs?|days?|campaigns?|quarters?)\b)(?:[ -]?(?:bc?d?e?f?g?h?i?|cd?e?f?g?h?i?|de?f?g?h?i?|ef?g?h?i?|fg?h?i?|gh?i?|hi?|i))?\b',
  # [1] TRAPPIST-1 (con o sin letra).
  '\bTRAPPIST[ -]?1\b',
  # [2] Catálogos de estrella con letra de planeta obligatoria y componente
  # opcional: HD, HIP, GJ, Gliese, LHS, LTT, HR, Ross, Wolf, L, TWA, PDS
  # ("L 98-59 b", "LTT 1445A b", "TWA 7 b", "PDS 70 b"). "HD 189733 A",
  # "HR 4796A", "TWA 7 disk" y "PDS 110 dipper" no casan.
  '\b(?:HD|HIP|GJ|Gliese|LHS|LTT|HR|Ross|Wolf|L|TWA|PDS)[ -]?\d+(?:-\d+)?(?:[ -]?[A-C])?[ -]?(?:bc?d?e?f?g?h?|cd?e?f?g?h?|de?f?g?h?|ef?g?h?|fg?h?|gh?|h)\b',
  # [3] Genérico designación + abreviatura de constelación + letra: "V1298 Tau b",
  # "AU Mic b", "DS Tuc A b", "51 Peg b", "tau Boo b", "Proxima Cen b".
  '\b(?:V\d{2,4}|[A-Z]{2}|\d{1,3}|(?i:alpha|beta|gamma|delta|epsilon|zeta|eta|theta|iota|kappa|lambda|mu|nu|xi|omicron|pi|rho|sigma|tau|upsilon|phi|chi|psi|omega|alf|bet|gam|del|eps|zet|tet|iot|kap|lam|omi|sig|ups|ome)|Proxima)[ -](?:And|Ant|Aps|Aqr|Aql|Ara|Ari|Aur|Boo|Cae|Cam|Cnc|CVn|CMa|CMi|Cap|Car|Cas|Cen|Cep|Cet|Cha|Cir|Col|Com|CrA|CrB|Crv|Crt|Cru|Cyg|Del|Dor|Dra|Equ|Eri|For|Gem|Gru|Her|Hor|Hya|Hyi|Ind|Lac|Leo|LMi|Lep|Lib|Lup|Lyn|Lyr|Men|Mic|Mon|Mus|Nor|Oct|Oph|Ori|Pav|Peg|Per|Phe|Pic|PsA|Psc|Pup|Pyx|Ret|Sge|Sgr|Sco|Scl|Sct|Ser|Sex|Tau|Tel|Tri|TrA|Tuc|UMa|UMi|Vel|Vir|Vol|Vul)(?:[ -][A-C])?[ -](?:bc?d?e?f?g?h?i?|cd?e?f?g?h?i?|de?f?g?h?i?|ef?g?h?i?|fg?h?i?|gh?i?|hi?|i)\b',
  # [4] Anfitriona sin letra SOLO si es estrella variable V#### + constelación
  # ("the V1298 Tau system"). RR Lyr, BL Lac, TW Hya, FU Ori, AU Mic sin letra no casan.
  '\bV\d{2,4}[ -](?:And|Ant|Aps|Aqr|Aql|Ara|Ari|Aur|Boo|Cae|Cam|Cnc|CVn|CMa|CMi|Cap|Car|Cas|Cen|Cep|Cet|Cha|Cir|Col|Com|CrA|CrB|Crv|Crt|Cru|Cyg|Del|Dor|Dra|Equ|Eri|For|Gem|Gru|Her|Hor|Hya|Hyi|Ind|Lac|Leo|LMi|Lep|Lib|Lup|Lyn|Lyr|Men|Mic|Mon|Mus|Nor|Oct|Oph|Ori|Pav|Peg|Per|Phe|Pic|PsA|Psc|Pup|Pyx|Ret|Sge|Sgr|Sco|Scl|Sct|Ser|Sex|Tau|Tel|Tri|TrA|Tuc|UMa|UMi|Vel|Vir|Vol|Vul)\b',
  # [5] Coordenadas J...+/-... con letra de planeta: "RX J0534.0-0221 b".
  '\bJ\d{4}(?:\.\d+)?[+-]\d{2,4}(?:\.\d+)?[ -]?(?:bc?d?e?f?g?h?|cd?e?f?g?h?|de?f?g?h?|ef?g?h?|fg?h?|gh?|h)\b',
  # [6] Genitivo completo sin letra SOLO con número de Flamsteed:
  # "61 Cygni", "51 Pegasi".
  '\b\d{1,3}[ -](?:Andromedae|Antliae|Apodis|Aquarii|Aquilae|Arae|Arietis|Aurigae|Bootis|Caeli|Camelopardalis|Cancri|Canum Venaticorum|Canis Majoris|Canis Minoris|Capricorni|Carinae|Cassiopeiae|Centauri|Cephei|Ceti|Chamaeleontis|Circini|Columbae|Comae Berenices|Coronae Australis|Coronae Borealis|Corvi|Crateris|Crucis|Cygni|Delphini|Doradus|Draconis|Equulei|Eridani|Fornacis|Geminorum|Gruis|Herculis|Horologii|Hydrae|Hydri|Indi|Lacertae|Leonis|Leonis Minoris|Leporis|Librae|Lupi|Lyncis|Lyrae|Mensae|Microscopii|Monocerotis|Muscae|Normae|Octantis|Ophiuchi|Orionis|Pavonis|Pegasi|Persei|Phoenicis|Pictoris|Piscis Austrini|Piscium|Puppis|Pyxidis|Reticuli|Sagittae|Sagittarii|Scorpii|Sculptoris|Scuti|Serpentis|Sextantis|Tauri|Telescopii|Trianguli|Trianguli Australis|Tucanae|Ursae Majoris|Ursae Minoris|Velorum|Virginis|Volantis|Vulpeculae)\b',
  # [7] Genitivo completo con prefijo V####, dos mayúsculas, letra griega o Proxima
  # y letra de planeta obligatoria: "tau Bootis b", "Proxima Centauri b".
  # "eta Carinae", "delta Scuti", "RV Tauri" no casan.
  '\b(?:V\d{2,4}|[A-Z]{2}|(?i:alpha|beta|gamma|delta|epsilon|zeta|eta|theta|iota|kappa|lambda|mu|nu|xi|omicron|pi|rho|sigma|tau|upsilon|phi|chi|psi|omega)|Proxima)[ -](?:Andromedae|Antliae|Apodis|Aquarii|Aquilae|Arae|Arietis|Aurigae|Bootis|Caeli|Camelopardalis|Cancri|Canum Venaticorum|Canis Majoris|Canis Minoris|Capricorni|Carinae|Cassiopeiae|Centauri|Cephei|Ceti|Chamaeleontis|Circini|Columbae|Comae Berenices|Coronae Australis|Coronae Borealis|Corvi|Crateris|Crucis|Cygni|Delphini|Doradus|Draconis|Equulei|Eridani|Fornacis|Geminorum|Gruis|Herculis|Horologii|Hydrae|Hydri|Indi|Lacertae|Leonis|Leonis Minoris|Leporis|Librae|Lupi|Lyncis|Lyrae|Mensae|Microscopii|Monocerotis|Muscae|Normae|Octantis|Ophiuchi|Orionis|Pavonis|Pegasi|Persei|Phoenicis|Pictoris|Piscis Austrini|Piscium|Puppis|Pyxidis|Reticuli|Sagittae|Sagittarii|Scorpii|Sculptoris|Scuti|Serpentis|Sextantis|Tauri|Telescopii|Trianguli|Trianguli Australis|Tucanae|Ursae Majoris|Ursae Minoris|Velorum|Virginis|Volantis|Vulpeculae)(?:[ -][A-C])?[ -](?:bc?d?e?f?g?h?|cd?e?f?g?h?|de?f?g?h?|ef?g?h?|fg?h?|gh?|h)\b',
]

[sources.arxiv]
# PROVISIONAL · decisión abierta (docs/OPEN_DECISIONS.md, T20); astro-ph.HE en evaluación
categories = ["astro-ph.EP", "astro-ph.GA"]
# page_size y max_results_per_fetch: propuestos, se confirman con los primeros --dry-run reales.
# page_size: entradas por página de la API de arXiv.
page_size = 100
# max_results_per_fetch: tope de resultados acumulados en una ingesta; límite de
# cortesía hacia arXiv y de memoria, no de gasto.
max_results_per_fetch = 400
# ingest_via: vía de ingesta (T60.c, ADR 0010). "oai" = OAI-PMH de
# oaipmh.arxiv.org, el endpoint que arXiv documenta para cosecha programada;
# "api" = /api/query, la vía original, degradada desde el 406 sistemático
# del 2026-09-21 (cuatro episodios entre el 21 y el 25, todos más largos que
# la ventana de reintento de T60.b, cero recuperaciones). La vía "api" NO se
# borra: es el punto de comparación si OAI también fallara, y volver atrás
# es cambiar este string.
ingest_via = "oai"
# URL nueva: export.arxiv.org/oai2 está obsoleta y redirige aquí (arXiv migró
# el endpoint OAI a host propio en marzo de 2025). Origen distinto al de la
# API, que es justo lo que hace que esta vía responda cuando la otra no.
oai_base_url = "https://oaipmh.arxiv.org/oai"
# arXivRaw y no arXiv ni oai_dc: es el único formato que trae el historial de
# versiones con hora completa (RFC-2822). `arXiv` da <created> sin hora
# (perderíamos el orden dentro de la noche) y `oai_dc` da las categorías en
# prosa ("Astrophysics - Earth and Planetary Astrophysics"), que rompería
# Item.categories.
oai_metadata_prefix = "arXivRaw"
# PROVISIONAL, sin datos de campo. Días de ventana sobre el datestamp de
# ANUNCIO (el OAI-PMH de arXiv no filtra por fecha de envío). El suelo del
# filtro fino NO es `since`: baja dos días respecto al inicio de la ventana,
# porque un lote con datestamp D trae envíos desde D-2 18:00 UTC y usar
# `since` descartaba la franja de la tarde anterior -- un 44 % de las
# novedades, medido. Ver oai_client.py::fetch_new y ADR 0010.
# Subir este valor NO trae más novedades: trae lotes más viejos que el suelo
# descarta, y esos lotes sí gastan max_requests_per_fetch. De ahí la cota
# `le=7` en ArxivConfig.
oai_lookback_days = 2
# PROVISIONAL. Techo duro de peticiones HTTP por ingesta -- INTENTADAS, no
# servidas: la cuota se cobra antes de pedir. Peor caso: 6 x ~93 s = 9,3 min,
# 3,4 % de limits.run_timeout_s, y PipelineConfig lo valida contra ese tope al
# cargar. Los ~93 s por petición solo son una cota porque transport.py acota
# la duración total con anyio.fail_after; httpx.Timeout no lo hace. Caso
# típico medido: 2 peticiones, ~6 s.
max_requests_per_fetch = 6
# retry_max_attempts / retry_base_delay_s / retry_max_elapsed_s: reintento
# ante fallos transitorios de arXiv. Motivado por el 406 observado el
# 2026-09-21: cuerpo vacío, sin Retry-After, cabeceras de Fastly/Varnish (vía
# CDN delante de arXiv, no la aplicación), y transitorio -- la misma
# consulta devolvió 200 minutos después. Backoff exponencial con jitter
# (infrastructure/arxiv/retry.py): 4 intentos, 5 s de base, doblando cada
# vez (5, 10, 20 s nominales antes de jitter).
#
# retry_max_attempts es un TOPE, no una garantía: con fallos lentos (p. ej.
# un TransportError que agota el timeout HTTP antes de que la espera de
# cortesía se cumpla) se sirven menos de 4 intentos, porque
# retry_max_elapsed_s puede cortar antes -- deliberado, el tiempo manda
# sobre el número de intentos en una noche con corte duro.
#
# retry_max_elapsed_s tampoco es un tope duro del tiempo total: acota
# cuándo puede INICIARSE un nuevo intento (la comprobación es anterior a
# dormir, ver Retrier.attempts), no cuánto tarda en resolverse el intento
# ya iniciado. El techo real por página está por encima de estos 60 s: hay
# que sumar, en el peor caso, el timeout HTTP del último intento en curso
# (_HTTP_TIMEOUT_S = 30 s, cli.py) y el espaciado de cortesía si tocara
# esperarlo (MIN_REQUEST_INTERVAL_S = 3 s, client.py) -- del orden de 93 s,
# no 60 s.
#
# Validado al cargar (ArxivConfig): el PEOR CASO con jitter, no el backoff
# nominal, debe caber en retry_max_elapsed_s -- _default_jitter multiplica
# cada espera hasta por MAX_JITTER_FACTOR (1,5): 5 * 1,5 * (2**(4-1) - 1)
# = 52,5 s <= 60 s.
#
# PROVISIONAL: sin datos de campo sobre cuánto dura el 406 del CDN más allá
# del caso único observado; a calibrar en T60 si vuelve a aparecer.
retry_max_attempts = 4
retry_base_delay_s = 5.0
retry_max_elapsed_s = 60.0

[sources.exoplanet_archive]
# NASA Exoplanet Archive (T74, ADR 0012): fuente consumida solo por código
# Python, sin servidor MCP. TAP sync para las soluciones publicadas de cada
# planeta y servicio de alias para resolver nombres alternativos.
tap_url = "https://exoplanetarchive.ipac.caltech.edu/TAP/sync"
alias_url = "https://exoplanetarchive.ipac.caltech.edu/cgi-bin/Lookup/nph-aliaslookup.py"
# min_request_interval_s: espaciado de cortesía entre peticiones (el archivo
# no publica una cifra; 2 s es la decisión del autor para T74).
min_request_interval_s = 2.0
# request_timeout_s: duración TOTAL de una petición, acotada con
# anyio.fail_after (httpx.Timeout solo acota cada operación por separado).
request_timeout_s = 30.0
# max_requests_per_night: techo duro, INTENTADAS, comprobado antes de enviar.
# Peor caso: 40 x (30 + 2) = 1.280 s, que sumados al de arXiv (558 s) caben
# en el 25 % de limits.run_timeout_s (4.050 s); PipelineConfig lo valida.
# Cada nombre de planeta distinto cuesta como mucho 2 peticiones (alias y
# ps) más 1 del índice. El peor caso del archivo se suma al presupuesto de
# ingesta de la noche real aunque la noche aún no consulte el archivo
# (conservador, a propósito). En `--dry-run` las peticiones crecen con el
# histórico de lecturas con medidas utilizables, no con los nombres de una
# sola noche; el techo se revisa en T76. Sin datos de campo: PROVISIONAL.
max_requests_per_night = 40

[sources.exoplanet_archive.snapshot]
# Snapshot del archivo (T81): `nocturna archive-snapshot`, aparte de la noche,
# sin LLM. Completo una vez al mes natural, incremental el resto.
# max_requests: techo duro de peticiones por ejecución (mínimo 3).
max_requests = 6
# request_timeout_s: duración TOTAL de una petición; la descarga completa de
# `ps` (~40.000 filas) tarda más que una consulta de planeta.
request_timeout_s = 120.0
# max_response_bytes: tope de tamaño de una respuesta (64 MiB).
max_response_bytes = 67108864
# planet_batch_size: planetas por consulta `pl_name in (...)` (1-100).
planet_batch_size = 75
# max_change_fraction: si las bajas o los cambios de default superan esta
# fracción de lo ya guardado, el snapshot aborta sin persistir (respuesta
# truncada, casi seguro).
max_change_fraction = 0.10

[tension]
# threshold_sigma: una medida del paper es candidata si su σ frente a la
# solución por defecto del archivo (TensionResult.reference_sigma) alcanza
# este umbral. 3 sigma, decisión del autor (T74); a revisar con los datos
# que devuelva el informe del dry-run.
threshold_sigma = 3.0

[tension.period]
# Regla del periodo (T88). Un periodo del paper solo es candidato si difiere de
# la referencia en ΔP/P_ref >= min_relative_difference o en ΔP >=
# min_absolute_difference_hours (se convierte a días al construir la regla).
min_relative_difference = 1e-4
min_absolute_difference_hours = 1.0
# Sospecha de alias: P1/P2 o P2/P1 a menos de alias_tolerance (absoluta) de un
# entero n, con 2 <= n <= alias_max_harmonic. Solo marca; no descarta.
alias_tolerance = 0.01
alias_max_harmonic = 5

[tension.own_solution]
# Solución propia del paper en el archivo (T83, ADR 0023). Además de por
# `arxiv_id`, una solución sin `arxiv_id` (bibcode de revista) se considera la
# del propio paper si su masa o radio casa con una medida del paper a
# <= value_rel_tolerance (relativa al valor del archivo) y su pl_pubdate no es
# anterior al mes del paper menos pubdate_margin_months. Si la fecha es
# plausible pero el valor no casa (y siempre en periodo) es ambigua: sigue
# siendo previa, pero no sostiene una confirmación independiente.
value_rel_tolerance = 0.01
pubdate_margin_months = 6

[measurement_findings]
# Findings `primera_medida` y `confirmacion_independiente` (T89, ADR 0020).
# Se generan sin LLM desde las evaluaciones de tensión guardadas (T88) y los
# decide el Editor junto con el resto de candidatos de la noche.
# max_candidates_per_night: tope de candidatos de T89 por noche (D9). Entra en
# la reserva del Editor: editor_base_tokens + (max_items_per_night +
# max_candidates_per_night + max_writer_calls_per_night) *
# editor_tokens_per_candidate <= editor_reserve_tokens
# (2500 + (30 + 5 + 2) * 850 = 33950 <= 60000; validado al cargar, T75).
max_candidates_per_night = 5
# confirmation_max_sigma: una confirmación exige todas las medidas del paper a
# σ <= este valor de la referencia del archivo (D4).
confirmation_max_sigma = 2.0
# confirmation_window_days: la más reciente de las dos entradas (paper y
# solución del archivo) debe caer en los últimos N días (D5).
confirmation_window_days = 30
# confirmation_enabled: apagada (D6) hasta cerrar T83 (solución propia por
# `arxiv_id` y por valores, ADR 0023). Activada por el autor el 2026-10-06
# tras el informe de T83 en la base real (ninguna confirmación con referencia
# propia o ambigua). Con false no se genera ninguna `confirmacion_independiente`
# y `run-night --dry-run` las lista como bloqueadas.
confirmation_enabled = true

[llm]
provider = "agent_sdk"

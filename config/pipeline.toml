# Configuración del pipeline nocturno de Nocturna.
# Ninguna clave de esta sección tiene valor por defecto en código: si falta o
# está mal escrita, la carga debe fallar (ver infrastructure/config.py).

[budget]
# nightly_tokens: tope fijado en CLAUDE.md ("Control de gasto"), valor inicial conservador.
nightly_tokens = 300000
# editor_reserve_tokens: propuesto, se calibra en T60 con Settings > Usage.
editor_reserve_tokens = 60000
# weekly_reset_weekday / weekly_reset_hour: PLACEHOLDER, decisión abierta (docs/OPEN_DECISIONS.md).
weekly_reset_weekday = "monday"
weekly_reset_hour = 0
reset_day_multiplier = 1.0
# reader_estimated_tokens: estimación de coste que se compara contra el
# presupuesto restante antes de llamar al Reader (`BudgetGuard.authorize`),
# no el gasto real, que no se conoce hasta después de la llamada. Composición
# aproximada (T41): prompt de rol (~290 tokens medidos) + abstract medio
# (~350) + el gasto lateral de Haiku que T40 midió por llamada (~950) +
# salida (~600) ≈ 2.200, doblado por margen ≈ 6.000. Si el gasto real de una
# llamada supera esta estimación, nightly_tokens se rebasa en (real −
# estimado) de esa última llamada: modo de fallo que ya tenía el diseño de
# T30, no uno nuevo de T41. Valor a calibrar en T60, como item_timeout_s.
reader_estimated_tokens = 6000
# popularizer_estimated_tokens: misma lógica que reader_estimated_tokens,
# para el Popularizer. Composición aproximada (T42): prompt de rol (~600-700
# tokens, define tres niveles, más largo que los ~290 del Reader) + la
# Reading serializada (título, resumen ~100, objetos ~30, hasta 5 claims
# ~150) ≈ 1.000 de entrada; el gasto lateral de Haiku que T40 midió por
# llamada (~950); salida de hasta 660 palabras entre los tres niveles y el
# titular, en español a ~1,6 tokens/palabra ≈ 1.300-1.400 -- el componente
# que domina y donde el Popularizer se separa del Reader (442 de salida en el
# humo real). Real esperado ≈ 3.350, con el mismo margen que T41 aplicó
# (6.000 sobre 2.796 medidos ≈ 2,15x) → 7.000. Si el gasto real de una
# llamada supera esta estimación, nightly_tokens se rebasa en (real -
# estimado) de esa última llamada, igual que con el Reader. Valor a calibrar
# en T60, con popularizer-v1 como baseline.
#
# Aritmética del pool Reader+Popularizer = nightly_tokens -
# editor_reserve_tokens = 300.000 - 60.000 = 240.000. Reader: 40 ítems x
# 2.796 medidos ≈ 112.000. Candidatos con score >= 4 por noche es la
# incógnita de T60: con 25% -> 145.500 (61% del pool); 40% -> 165.600 (69%);
# 60% -> 192.400 (80%). Punto de ruptura: ~38 candidatos de 40, y a partir de
# ahí authorize deniega, el Run queda partial y la reserva del Editor sigue
# intacta -- comportamiento correcto, no un fallo.
popularizer_estimated_tokens = 7000
# editor_base_tokens: parte fija de la estimación de coste del Editor, la
# única llamada de la noche a Opus, sobre la que `PipelineConfig` exige que
# `editor_base_tokens + max_items_per_night * editor_tokens_per_candidate`
# quepa en `editor_reserve_tokens` (ver el validador de `PipelineConfig`).
# T60: con dos observaciones reales del coste del Editor -- T43 humo,
# N=3 -> 3.381 tokens; primera noche real (2026-09-18), N=14 -> 11.890
# tokens -- se ajusta la recta que pasa por ambos puntos: ~774
# tokens/candidato sobre ~1.060 fijos.
#
# Las dos rectas de estimación (la vieja, 4.000 + 700xN, y esta) se cruzan
# exactamente en N=10 (ambas dan 11.000); por debajo de N=10 la nueva es
# MENOS conservadora que la vieja: el margen baja de 1,80x a 1,49x en N=3,
# y de 2,56x a 1,83x en N=1. Lo que motiva el cambio no es una monotonía
# inexistente sino el peor caso que la guarda existe para cubrir: en N=40
# (`max_items_per_night`) la vieja estimación (32.000) ya caía por DEBAJO
# de la recta observada (≈32.002) -- ya era un subestimador justo donde
# más importa. La nueva queda por ENCIMA de la recta observada en todo el
# rango 1-40 (nuevo - recta = 1.440 + 76xN, estrictamente positivo y
# creciente): margen mínimo 1,14x en N=40; N=3 -> 1,49x; N=14 -> 1,21x.
#
# Es un ajuste PROVISIONAL: dos observaciones para dos parámetros es un
# sistema exactamente determinado (residuo cero, cero confianza), no una
# regresión con la que fiarse. Se reajusta por regresión sobre ~14 noches
# al cierre de T60. Ver docs/CALIBRACION.md ("Hallazgo 2").
#
# El invariante que valida `PipelineConfig` (arriba) cubre UN intento del
# Editor; `max_editor_calls_per_night = 2` autoriza un segundo intento
# contra el presupuesto completo si el primero falla por JSON inválido,
# así que dos intentos a N=40 suman 73.000 tokens (2 x 36.500) frente a
# los 60.000 de `editor_reserve_tokens`. Es propiedad preexistente -- el
# segundo intento se autoriza contra el presupuesto completo y se deniega
# si no cabe, cerrando la noche `partial` --, pero este ajuste sube ese
# peor caso de 64.000 (con los valores viejos: 2 x 32.000) a 73.000, y
# merece constar.
editor_base_tokens = 2500
# editor_tokens_per_candidate: coste marginal, por candidato, de la única
# llamada al Editor. Multiplicado por `max_items_per_night` en el
# validador de `PipelineConfig` para comprobar que la reserva del Editor
# basta en el peor caso (todos los ítems de la noche llegando como
# candidatos). Ajustado junto con editor_base_tokens (ver comentario ahí)
# a partir de las mismas dos observaciones reales (N=3 -> 3.381; N=14 ->
# 11.890): recta ~774 tokens/candidato sobre ~1.060 fijos, redondeada a
# 850 sobre 2.500 fijos para quedar por encima de lo observado en todo el
# rango, no solo en los dos puntos medidos. Mismo carácter PROVISIONAL que
# editor_base_tokens: a reajustar por regresión sobre ~14 noches al cierre
# de T60.
editor_tokens_per_candidate = 850

[limits]
# max_items_per_night y max_turns_per_agent: valores fijados en CLAUDE.md ("Control de gasto").
max_items_per_night = 40
max_turns_per_agent = 3
# item_timeout_s y run_timeout_s: propuestos, se calibran en T60.
item_timeout_s = 180
run_timeout_s = 16200
# editor_timeout_s: timeout propio del Editor, separado de item_timeout_s.
# item_timeout_s (180 s) está pensado para una llamada del Reader/Popularizer
# sobre un único abstract; el Editor recibe, en una sola llamada a Opus,
# hasta max_items_per_night (40) candidatos de la noche entera -- no cabe en
# esa ventana. Un LLMTimeout no se reintenta en AgentRunner.run (es uno de
# los tres desenlaces terminales, junto a LLMRateLimited y LLMError), así que
# un timeout corto para el Editor no es "otro intento": es la noche entera
# sin publicar nada, con la reserva del Editor ya gastada. 300 s es un valor
# propuesto, igual que item_timeout_s; se calibra en T60 con la latencia real
# de Opus sobre 40 candidatos.
editor_timeout_s = 300
# max_editor_calls_per_night: acota intentos, no éxitos. Lo que cuesta
# presupuesto es el intento, no el acierto, así que se cuentan las llamadas
# de cualquier estado; el 2 preserva "un Editor por noche" en su sentido real
# (una edición publicada) y deja vivo el reintento por JSON inválido que
# concede CLAUDE.md. Valor a calibrar en T60.
max_editor_calls_per_night = 2
# max_calls_per_item: tope de llamadas de Reader/Popularizer por ítem (el
# intento más el reintento por JSON inválido que concede CLAUDE.md). El tope
# de llamadas de Reader/Popularizer en toda la noche sale de multiplicar
# esta clave por max_items_per_night, nunca de un "2" escrito a mano en
# application/budget.py. Valor a calibrar en T60.
max_calls_per_item = 2
# popularizer_min_interest_score: umbral de Reading.interest_score a partir
# del cual se llama al Popularizer. PLAN_TAREAS.md fija en T60 «se decide si
# el interest_score >= 4 es el umbral correcto»: tiene que ser calibrable sin
# tocar código, de ahí que sea configuración y no un literal en el
# orquestador.
popularizer_min_interest_score = 4
# max_consecutive_failures: cortacircuitos de fallos consecutivos, cualquier
# rol. Mitigación (a) que docs/TECHNICAL_DEBT.md asigna a T44 para la fuga
# de ~600.000-800.000 tokens/noche de llamadas que mueren antes de un
# ResultMessage (timeout de socket, cancelación previa a cualquier
# respuesta, kill del proceso): esas llamadas no dejan usage ni
# model_usage que contabilizar, así que la única defensa posible es dejar
# de intentarlo. Con 5 fallos seguidos, RunNight cierra el Run como
# partial en vez de seguir gastando sesiones sin contabilidad sobre el
# resto de la noche -- acota la fuga a ~5 llamadas fallidas en vez de
# hasta las 80 que permite CALL_LIMIT_REACHED. Valor propuesto sin datos
# de campo, a calibrar en T60.
max_consecutive_failures = 5

[window]
start = "00:00"
hard_stop = "04:45"
# timezone: la hora local del sistema depende de `TZ`, que `cron` no siempre
# propaga y que un contenedor pone en UTC por defecto. Con el proceso en UTC,
# un hard_stop de 04:45 se dispararía a las 06:45 locales y abriría la
# segunda sesión de cinco horas que CLAUDE.md prohíbe. La clave hace el
# comportamiento reproducible y testeable, incluidos los cambios de hora.
timezone = "Europe/Madrid"

[models]
reader = "sonnet"
popularizer = "sonnet"
editor = "opus"

[sources.arxiv]
# PROVISIONAL · decisión abierta (docs/OPEN_DECISIONS.md, T20); astro-ph.HE en evaluación
categories = ["astro-ph.EP", "astro-ph.GA"]
# page_size y max_results_per_fetch: propuestos, se confirman con los primeros --dry-run reales.
# page_size: entradas por página de la API de arXiv.
page_size = 100
# max_results_per_fetch: tope de resultados acumulados en una ingesta; límite de
# cortesía hacia arXiv y de memoria, no de gasto.
max_results_per_fetch = 400

[llm]
provider = "agent_sdk"
